<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex">
  <title>Bestellungen – Zum Irrbühl</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="navbar-inner">
      <span class="brand" data-i18n="restaurant">Zum Irrbühl</span>
      <div class="nav-actions">
        <button type="button" id="lang-btn" class="nav-btn">RU</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <p id="demo-banner" class="notice" data-i18n="demoMode" hidden></p>
    <h1 data-i18n="resultsTitle">Bestellungen</h1>
    <p id="total" class="subhead"></p>

    <section class="section">
      <ul class="group">
        <li>
          <label class="row switch-row">
            <span data-i18n="resultsShowAll">Auch nicht bestellte Gerichte anzeigen</span>
            <input type="checkbox" id="show-all" class="switch" role="switch">
          </label>
        </li>
      </ul>
      <div class="results-actions">
        <button type="button" id="refresh" class="btn-secondary" data-i18n="resultsRefresh">Aktualisieren</button>
      </div>
    </section>

    <section class="section">
      <div id="results"></div>
    </section>
  </main>

  <script src="js/common.js"></script>
  <script src="js/results.js"></script>
</body>
</html>
