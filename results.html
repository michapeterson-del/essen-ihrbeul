<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex">
  <title>Bestellungen – Zum Irrbühl</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
  <link rel="stylesheet" href="css/style.css?v=20261107g">
</head>
<body>
  <header class="navbar">
    <div class="navbar-inner">
      <span class="brand" data-i18n="restaurant">Zum Irrbühl</span>
      <div class="nav-actions">
        <button type="button" id="lang-btn" class="nav-btn">DE</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <p id="demo-banner" class="notice" data-i18n="demoMode" hidden></p>
    <h1 data-i18n="resultsTitle">Bestellungen</h1>
    <p id="total" class="subhead"></p>

    <section class="section results-toolbar">
      <div class="segmented" role="group">
        <button type="button" data-view="dish" aria-pressed="true" data-i18n="viewByDish">Nach Gericht</button>
        <button type="button" data-view="person" aria-pressed="false" data-i18n="viewByPerson">Nach Person</button>
      </div>
      <button type="button" id="refresh" class="nav-btn" data-i18n-aria="resultsRefresh" aria-label="Aktualisieren">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </section>

    <section class="section">
      <div id="results"></div>
    </section>

    <section class="section">
      <button type="button" id="delete-all" class="btn-destructive" data-i18n="resultsDeleteAll" hidden>Alle Bestellungen löschen</button>
    </section>
  </main>

  <script src="js/common.js?v=20261107g"></script>
  <script src="js/results.js?v=20261107g"></script>
</body>
</html>
