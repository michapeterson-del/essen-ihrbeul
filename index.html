<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Umfrage – Zum Irrbühl</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍝</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="loading">
  <header class="topbar">
    <span class="brand" data-i18n="restaurant">Zum Irrbühl</span>
    <div class="actions">
      <button type="button" id="theme-btn" class="icon-btn" data-i18n-aria="themeToggle" aria-label="Hell/Dunkel umschalten"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
      <button type="button" id="lang-btn" class="lang-btn">RU</button>
    </div>
  </header>

  <main class="wrap">
    <p id="demo-banner" class="banner" data-i18n="demoMode" hidden></p>

    <form id="survey" novalidate>
      <h1 data-i18n="question">Was möchtest du essen?</h1>
      <p class="muted" data-i18n="intro">Wähle genau ein Gericht aus. Du kannst nur einmal abstimmen.</p>

      <label class="field">
        <span data-i18n="nameLabel">Dein Name (freiwillig)</span>
        <input id="voter-name" type="text" maxlength="60" autocomplete="name" data-i18n-placeholder="namePlaceholder">
      </label>

      <div class="search">
        <input id="search" type="search" autocomplete="off" data-i18n-placeholder="searchPlaceholder" data-i18n-aria="searchPlaceholder">
        <button type="button" id="search-clear" class="icon-btn" data-i18n-aria="searchClear" hidden>✕</button>
      </div>

      <p class="ham-note" data-i18n="hamNote">* = mit Vorderschinken</p>

      <div id="menu" role="radiogroup"></div>
      <p id="no-results" class="muted center" data-i18n="noResults" hidden>Kein Gericht gefunden.</p>

      <div id="vote-bar" class="vote-bar">
        <div class="selected">
          <small data-i18n="selectedLabel">Deine Wahl:</small>
          <strong id="selected-dish">—</strong>
        </div>
        <button type="submit" id="submit" class="primary" disabled data-i18n="submit">Abstimmen</button>
      </div>
      <p id="error" class="error" role="alert" hidden></p>
    </form>

    <section id="thanks" class="thanks" hidden>
      <div class="emoji" aria-hidden="true">🍽️</div>
      <h1 data-i18n="thanksTitle">Danke!</h1>
      <p id="already" class="banner" data-i18n="alreadyVoted" hidden></p>
      <p data-i18n="thanksText">Deine Stimme wurde gespeichert.</p>
      <p><span data-i18n="thanksChoice">Du hast gewählt:</span><br><strong id="thanks-choice"></strong></p>
      <p class="muted" data-i18n="guten">Guten Appetit!</p>
      <p><a href="results.html" data-i18n="toResults">Ergebnisse ansehen</a></p>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
