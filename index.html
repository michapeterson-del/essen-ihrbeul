<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Bestellung – Zum Irrbühl</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍝</text></svg>">
  <link rel="stylesheet" href="css/style.css?v=20261107h">
</head>
<body class="loading">
  <header class="navbar">
    <div class="navbar-inner">
      <span class="brand" data-i18n="restaurant">Zum Irrbühl</span>
      <div class="nav-actions">
        <button type="button" id="lang-btn" class="nav-btn">DE</button>
      </div>
    </div>
    <div class="search-row" id="search-row">
      <div class="search-field">
        <svg class="icon-search" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <input id="search" type="search" autocomplete="off" enterkeyhint="search" data-i18n-placeholder="searchPlaceholder" data-i18n-aria="searchPlaceholder">
        <button type="button" id="search-clear" class="search-clear" data-i18n-aria="searchClear" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="m8.5 8.5 7 7m0-7-7 7" stroke="var(--color-surface)" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <p id="demo-banner" class="notice" data-i18n="demoMode" hidden></p>

    <form id="survey" novalidate>
      <h1 data-i18n="question">Was möchtest du essen?</h1>
      <p class="subhead" data-i18n="intro">Name eintragen, Gericht auswählen und auf „Bestellen“ tippen.</p>

      <section class="section">
        <ul class="group">
          <li class="row field-row" id="name-row">
            <label for="voter-name" data-i18n="nameLabel">Dein Name</label>
            <input id="voter-name" type="text" maxlength="40" autocomplete="given-name" required aria-required="true" data-i18n-placeholder="namePlaceholder">
          </li>
        </ul>
        <p id="name-error" class="error" role="alert" data-i18n="nameRequired" hidden>Bitte gib deinen Namen ein.</p>
        <p class="footnote" data-i18n="hamNote">* = mit Vorderschinken</p>
      </section>

      <div id="menu" role="radiogroup"></div>
      <p id="no-results" class="subhead center section" data-i18n="noResults" hidden>Kein Gericht gefunden.</p>
      <p id="error" class="error" role="alert" hidden></p>

      <div id="vote-bar" class="toolbar">
        <div class="toolbar-inner">
          <div class="selection" aria-live="polite">
            <span class="selection-label" data-i18n="selectedLabel">Deine Wahl:</span>
            <span class="selection-value" id="selected-dish">—</span>
          </div>
          <button type="submit" id="submit" class="btn-primary" disabled data-i18n="submit">Bestellen</button>
        </div>
      </div>
    </form>

    <section id="thanks" class="thanks" hidden>
      <svg class="thanks-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="m7 12.5 3.2 3.2L17 9" fill="none" stroke="var(--color-surface)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h1 data-i18n="thanksTitle">Danke!</h1>
      <p class="subhead" data-i18n="thanksText">Deine Bestellung ist eingegangen.</p>
      <ul class="group">
        <li class="row thanks-choice">
          <small data-i18n="thanksChoice">Du hast bestellt:</small>
          <strong id="thanks-choice"></strong>
          <small id="thanks-name"></small>
        </li>
      </ul>
      <p class="subhead section" data-i18n="guten">Guten Appetit!</p>
      <p class="section"><button type="button" id="order-again" class="btn-secondary" data-i18n="orderAgain">Noch etwas bestellen</button></p>
    </section>
  </main>

  <script src="js/common.js?v=20261107h"></script>
  <script src="js/app.js?v=20261107h"></script>
</body>
</html>
